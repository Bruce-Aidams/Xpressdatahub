services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninasdata-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
    networks:
      - ninasdata-network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: ninasdata-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ninasdata-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: ninasdata-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ninasdata}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-ninasdata}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ninasdata-network

  redis:
    image: redis:alpine
    container_name: ninasdata-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ninasdata-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninasdata-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    networks:
      - ninasdata-network
    depends_on:
      - app
      - mysql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninasdata-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www
    networks:
      - ninasdata-network
    depends_on:
      - app
      - mysql
      - redis

volumes:
  mysql_data:
  vendor_data:

networks:
  ninasdata-network:
    driver: bridge
